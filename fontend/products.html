<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Sản phẩm - TIS Broker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light"> <header id="header-placeholder"></header>

    <div class="bg-dark text-white pt-5 pb-4 mt-5" style="background: linear-gradient(135deg, #212529 0%, #D71920 100%);">
        <div class="container pt-4 text-center">
            <h1 class="fw-bold display-5">Tất cả Giải pháp Bảo hiểm</h1>
            <p class="lead opacity-75">Bảo vệ toàn diện cho Cá nhân và Doanh nghiệp của bạn</p>
        </div>
    </div>

    <main class="container py-5">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm sticky-top" style="top: 100px; z-index: 10;">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3"><i class="fas fa-filter me-2 text-danger"></i>Bộ lọc tìm kiếm</h6>
                        
                        <div class="mb-4">
                            <label class="form-label small text-muted fw-bold">Tên sản phẩm</label>
                            <div class="input-group input-group-sm">
                                <input type="text" id="filter-search" class="form-control border-end-0" placeholder="Nhập từ khóa...">
                                <span class="input-group-text bg-white border-start-0"><i class="fas fa-search text-muted"></i></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted fw-bold">Danh mục</label>
                            <div id="category-filter-list">
                                <div class="text-center py-2"><div class="spinner-border spinner-border-sm text-danger"></div></div>
                                </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
                    <h5 class="fw-bold m-0 text-dark">Kết quả tìm kiếm</h5>
                    <div class="text-muted small">Tìm thấy <span id="product-count" class="text-danger fw-bold fs-5">0</span> sản phẩm</div>
                </div>

                <div class="row g-4" id="all-products-grid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-danger"></div>
                        <p class="text-muted mt-2">Đang tải dữ liệu...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/products.js"></script> </body>
</html>
