<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm Bảo hiểm - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container pb-5">
        <h3 class="fw-bold mb-4">Khám phá các gói Bảo hiểm</h3>
        <div class="row mb-4">
            <div class="col-md-6"><input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm sản phẩm..."></div>
            <div class="col-md-4"><select id="category-filter" class="form-select"><option value="">Tất cả danh mục</option></select></div>
        </div>
        
        <div class="row g-4" id="product-grid">
            <div class="col-12 text-center text-muted">Đang tải sản phẩm...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
