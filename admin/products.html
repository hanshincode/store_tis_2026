<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - TIS Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* Giữ nguyên Style của bạn */
        .admin-sidebar { min-height: 100vh; background: #212529; width: 250px; }
        .product-img-td { width: 60px; height: 45px; object-fit: cover; border-radius: 4px; }
        .ck-editor__editable { min-height: 400px !important; }
    </style>
</head>
<body class="bg-light">

<div class="d-flex">
    <div class="admin-sidebar p-3 text-white">
        <h4 class="fw-bold text-danger text-center">TIS ADMIN</h4>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="index.html" class="nav-link text-white"><i class="fas fa-home me-2"></i>Dashboard</a></li>
            <li><a href="products.html" class="nav-link active bg-danger"><i class="fas fa-box me-2"></i>Sản phẩm</a></li>
            <li><a href="categories.html" class="nav-link text-white"><i class="fas fa-tags me-2"></i>Danh mục</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a href="javascript:void(0)" onclick="logout()" class="nav-link text-white"><i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Quản lý Sản phẩm</h2>
            <button class="btn btn-danger fw-bold" onclick="openModal()">
                <i class="fas fa-plus-circle me-1"></i> Thêm sản phẩm
            </button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá gốc</th>
                            <th class="text-end pe-3">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">Sản phẩm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="prod-id">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên sản phẩm</label>
                                <input type="text" id="prod-name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nội dung chi tiết (Bài viết)</label>
                                <textarea id="prod-content"></textarea>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Danh mục</label>
                                <select id="prod-category" class="form-select" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Giá gốc (VNĐ)</label>
                                <input type="number" id="prod-price" class="form-control" value="0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mô tả ngắn</label>
                                <textarea id="prod-desc" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ảnh đại diện</label>
                                <input type="file" id="prod-image" class="form-control" accept="image/*" onchange="previewImage(this)">
                                <img id="img-preview" src="" class="img-fluid mt-2 border rounded d-none">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-danger px-4" onclick="handleSave()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.ckeditor.com/4.22.1/full-all/ckeditor.js"></script>

<script src="../js/common.js"></script>
<script src="js/admin-products.js"></script>

</body>
</html>
