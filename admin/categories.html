<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh mục - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="bg-light">
    <div class="main-content">
        <div class="admin-card shadow-sm border-0 rounded-4 p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold m-0 text-dark">Quản lý Danh mục</h4>
                    <small class="text-muted">Quản lý các nhóm sản phẩm bảo hiểm chính</small>
                </div>
                <button class="btn btn-primary fw-bold px-3 shadow-sm" id="btn-open-add-modal">
                    <i class="fas fa-plus me-2"></i> Thêm mới
                </button>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Tên Danh Mục</th>
                            <th>Đường dẫn (Slug)</th>
                            <th>Nhóm Chuyên Môn</th>
                            <th class="text-end pe-3">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="category-list">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Thêm Danh mục mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                    <form id="category-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Tên danh mục</label>
                            <input type="text" id="c-name" class="form-control form-control-lg fs-6" placeholder="Ví dụ: Bảo hiểm sức khỏe" required>
                        </div>
                        <div class="mb-0">
                            <label class="form-label fw-bold small text-uppercase">Nhóm chuyên môn (Staff)</label>
                            <select id="c-spec" class="form-select form-control-lg fs-6" required>
                                <option value="property">Tài sản</option>
                                <option value="health" selected>Sức khỏe</option>
                                <option value="vehicle">Xe cộ</option>
                                <option value="marine">Hàng hải</option>
                            </select>
                            <div class="form-text mt-2 small text-muted">Dùng để phân phối yêu cầu tư vấn cho nhân sự phù hợp.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0 pb-4 justify-content-center">
                    <button type="button" class="btn btn-light px-4 fw-bold" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button id="btn-submit-category" class="btn btn-primary px-4 fw-bold shadow-sm">Lưu danh mục</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
