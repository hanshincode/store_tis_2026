<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/common.css"> 
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="main-content">
        <div class="row g-4 mb-4">
            <div class="col-md-4"><div class="admin-card stat-border stat-success h-100"><h6 class="text-muted">Doanh thu</h6><h3 class="fw-bold" id="stat-revenue">0 đ</h3></div></div>
            <div class="col-md-4"><div class="admin-card stat-border stat-warning h-100"><h6 class="text-muted">Đơn chờ duyệt</h6><h3 class="fw-bold" id="stat-pending">0</h3></div></div>
            <div class="col-md-4"><div class="admin-card stat-border stat-primary h-100"><h6 class="text-muted">Tổng đơn hàng</h6><h3 class="fw-bold" id="stat-total">0</h3></div></div>
        </div>
        <div class="admin-card">
            <h5 class="mb-3 fw-bold">Đơn hàng mới nhất</h5>
            <table class="table align-middle"><thead class="table-light"><tr><th>Mã</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày tạo</th></tr></thead><tbody id="dashboard-orders"></tbody></table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
